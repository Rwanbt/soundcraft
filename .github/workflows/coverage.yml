name: Rust coverage evidence

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'apps/**'
      - 'scripts/check-coverage.py'
      - 'scripts/test_check_coverage.py'
      - 'xtask/**'
      - '.github/workflows/coverage.yml'
  workflow_dispatch:
  schedule:
    - cron: '24 4 * * 3'

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: LLVM source coverage (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: llvm-coverage
      - name: Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgtk-3-dev libfontconfig1-dev pkg-config cmake
      - name: Install llvm-cov runner
        run: cargo install cargo-llvm-cov --locked
      - name: Self-test the coverage evidence policy
        run: python3 -m unittest discover -s scripts -p 'test_check_coverage.py' -v
      - name: Measure coverage from all unit and integration tests
        run: cargo llvm-cov --workspace --locked --lcov --output-path coverage.lcov
      - name: Coverage report
        run: cargo llvm-cov report --summary-only
      - name: Enforce measured workspace and critical-module coverage floors
        run: python3 scripts/check-coverage.py coverage.lcov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soundcraft-llvm-coverage
          path: coverage.lcov
          if-no-files-found: ignore
          retention-days: 14
