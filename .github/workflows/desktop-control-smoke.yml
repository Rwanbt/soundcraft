name: Real desktop control smoke

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'apps/soundcraft/**'
      - 'crates/**'
      - 'scripts/desktop-smoke.py'
      - '.github/workflows/desktop-control-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-smoke:
    name: Native GUI startup + JSON-lines + clean exit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: real-desktop-smoke
      - name: Install virtual display and software GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-x11-0 libgtk-3-dev \
            libfontconfig1-dev pkg-config cmake xvfb mesa-vulkan-drivers libgl1-mesa-dri
      - name: Build real desktop application
        run: cargo build --locked -p soundcraft
      - name: Launch, exercise loopback commands and close real GUI
        run: xvfb-run -a python3 scripts/desktop-smoke.py
